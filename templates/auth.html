<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DecoraAI — Sign In / Sign Up</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <style>
        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 30px 20px;
            background: #030712;
            position: relative;
        }

        .auth-card {
            width: 100%;
            max-width: 460px;
            background: #0b1120;
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 24px;
            padding: 36px 32px;
            box-shadow: 0 25px 60px rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(20px);
            z-index: 10;
        }

        .auth-header {
            text-align: center;
            margin-bottom: 28px;
        }

        .auth-header .logo-icon {
            margin: 0 auto 12px;
        }

        .auth-header h2 {
            font-size: 24px;
            font-weight: 700;
            color: white;
        }

        .auth-header p {
            font-size: 13px;
            color: #94a3b8;
            margin-top: 4px;
        }

        .auth-tabs {
            display: flex;
            background: #1e293b;
            border-radius: 12px;
            padding: 4px;
            margin-bottom: 24px;
        }

        .auth-tab-btn {
            flex: 1;
            padding: 10px;
            text-align: center;
            border-radius: 9px;
            font-size: 13px;
            font-weight: 600;
            color: #94a3b8;
            background: transparent;
            border: none;
            cursor: pointer;
            transition: 0.2s;
        }

        .auth-tab-btn.active {
            background: #3b82f6;
            color: white;
            box-shadow: 0 4px 12px rgba(59, 130, 246, 0.35);
        }

        .auth-form {
            display: none;
            flex-direction: column;
            gap: 16px;
        }

        .auth-form.active {
            display: flex;
        }

        .input-group {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .input-group label {
            font-size: 12px;
            color: #94a3b8;
            font-weight: 500;
        }

        .input-box {
            position: relative;
            display: flex;
            align-items: center;
        }

        .input-box i {
            position: absolute;
            left: 14px;
            color: #64748b;
            font-size: 14px;
        }

        .input-box input {
            width: 100%;
            padding: 12px 14px 12px 40px;
            background: #111827;
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            color: white;
            font-size: 14px;
            outline: none;
            transition: 0.2s;
        }

        .input-box input:focus {
            border-color: #3b82f6;
            box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.15);
        }

        .auth-submit-btn {
            width: 100%;
            padding: 14px;
            border-radius: 12px;
            background: linear-gradient(135deg, #7c3aed, #3b82f6);
            border: none;
            color: white;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: 0.2s;
            margin-top: 8px;
        }

        .auth-submit-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(124, 58, 237, 0.4);
        }

        .auth-alert {
            padding: 10px 14px;
            border-radius: 10px;
            font-size: 12px;
            margin-bottom: 14px;
            display: none;
        }

        .auth-alert.error {
            background: rgba(239, 68, 68, 0.15);
            border: 1px solid rgba(239, 68, 68, 0.3);
            color: #fca5a5;
            display: block;
        }

        .auth-alert.success {
            background: rgba(34, 197, 94, 0.15);
            border: 1px solid rgba(34, 197, 94, 0.3);
            color: #86efac;
            display: block;
        }

        .back-link {
            display: block;
            text-align: center;
            margin-top: 20px;
            font-size: 13px;
            color: #94a3b8;
            text-decoration: none;
            transition: 0.2s;
        }

        .back-link:hover {
            color: white;
        }
    </style>
</head>
<body>

    <div class="auth-card">
        <div class="auth-header">
            <div class="logo-icon">
                <i class="fas fa-couch" style="color:white; font-size:18px;"></i>
            </div>
            <h2>Decora<span style="color:#60a5fa;">AI</span></h2>
            <p>Sign in to save and manage your dream house projects</p>
        </div>

        <div class="auth-tabs">
            <button id="tab-login-btn" class="auth-tab-btn active" onclick="switchAuthTab('login')">Sign In</button>
            <button id="tab-signup-btn" class="auth-tab-btn" onclick="switchAuthTab('signup')">Create Account</button>
        </div>

        <div id="auth-alert" class="auth-alert"></div>

        <!-- LOGIN FORM -->
        <form id="login-form" class="auth-form active" onsubmit="handleLogin(event)">
            <div class="input-group">
                <label>Email Address</label>
                <div class="input-box">
                    <i class="fas fa-envelope"></i>
                    <input type="email" id="login-email" placeholder="name@example.com" required>
                </div>
            </div>

            <div class="input-group">
                <label>Password</label>
                <div class="input-box">
                    <i class="fas fa-lock"></i>
                    <input type="password" id="login-password" placeholder="••••••••" required>
                </div>
            </div>

            <button type="submit" id="login-btn" class="auth-submit-btn">
                ⚡ Sign In
            </button>
        </form>

        <!-- SIGNUP FORM -->
        <form id="signup-form" class="auth-form" onsubmit="handleSignup(event)">
            <div class="input-group">
                <label>Full Name</label>
                <div class="input-box">
                    <i class="fas fa-user"></i>
                    <input type="text" id="signup-name" placeholder="John Doe" required>
                </div>
            </div>

            <div class="input-group">
                <label>Email Address</label>
                <div class="input-box">
                    <i class="fas fa-envelope"></i>
                    <input type="email" id="signup-email" placeholder="name@example.com" required>
                </div>
            </div>

            <div class="input-group">
                <label>Password</label>
                <div class="input-box">
                    <i class="fas fa-lock"></i>
                    <input type="password" id="signup-password" placeholder="At least 6 characters" minlength="6" required>
                </div>
            </div>

            <button type="submit" id="signup-btn" class="auth-submit-btn">
                ✨ Create Account
            </button>
        </form>

        <a href="/" class="back-link">&larr; Back to DecoraAI Homepage</a>
    </div>

    <script>
        function switchAuthTab(mode) {
            const loginBtn = document.getElementById("tab-login-btn");
            const signupBtn = document.getElementById("tab-signup-btn");
            const loginForm = document.getElementById("login-form");
            const signupForm = document.getElementById("signup-form");
            const alertBox = document.getElementById("auth-alert");
            alertBox.className = "auth-alert";
            alertBox.style.display = "none";

            if (mode === 'signup') {
                loginBtn.classList.remove("active");
                signupBtn.classList.add("active");
                loginForm.classList.remove("active");
                signupForm.classList.add("active");
            } else {
                signupBtn.classList.remove("active");
                loginBtn.classList.add("active");
                signupForm.classList.remove("active");
                loginForm.classList.add("active");
            }
        }

        async function handleLogin(e) {
            e.preventDefault();
            const email = document.getElementById("login-email").value.trim();
            const password = document.getElementById("login-password").value;
            const btn = document.getElementById("login-btn");
            const alertBox = document.getElementById("auth-alert");

            btn.disabled = true;
            btn.innerText = "Signing in...";

            try {
                const res = await fetch("/api/auth/login", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ email, password })
                });
                const data = await res.json();

                if (res.ok && data.status === "success") {
                    alertBox.className = "auth-alert success";
                    alertBox.innerText = `Welcome back, ${data.user.name}! Redirecting...`;
                    alertBox.style.display = "block";
                    setTimeout(() => window.location.href = "/", 1000);
                } else {
                    alertBox.className = "auth-alert error";
                    alertBox.innerText = data.error || "Invalid email or password.";
                    alertBox.style.display = "block";
                }
            } catch (err) {
                alertBox.className = "auth-alert error";
                alertBox.innerText = "Network error. Please try again.";
                alertBox.style.display = "block";
            } finally {
                btn.disabled = false;
                btn.innerText = "⚡ Sign In";
            }
        }

        async function handleSignup(e) {
            e.preventDefault();
            const name = document.getElementById("signup-name").value.trim();
            const email = document.getElementById("signup-email").value.trim();
            const password = document.getElementById("signup-password").value;
            const btn = document.getElementById("signup-btn");
            const alertBox = document.getElementById("auth-alert");

            btn.disabled = true;
            btn.innerText = "Creating account...";

            try {
                const res = await fetch("/api/auth/signup", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ name, email, password })
                });
                const data = await res.json();

                if (res.ok && data.status === "success") {
                    alertBox.className = "auth-alert success";
                    alertBox.innerText = `Account created successfully! Redirecting...`;
                    alertBox.style.display = "block";
                    setTimeout(() => window.location.href = "/", 1000);
                } else {
                    alertBox.className = "auth-alert error";
                    alertBox.innerText = data.error || "Signup failed.";
                    alertBox.style.display = "block";
                }
            } catch (err) {
                alertBox.className = "auth-alert error";
                alertBox.innerText = "Network error. Please try again.";
                alertBox.style.display = "block";
            } finally {
                btn.disabled = false;
                btn.innerText = "✨ Create Account";
            }
        }
    </script>
</body>
</html>
